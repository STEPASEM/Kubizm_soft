{% extends 'base.html' %}
{% load static %}

{% block title %}Главная - Кубизм{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row g-4">
        <!-- Левая часть - загрузка фото -->
        <div class="col-md-6 d-flex">
            <div class="card shadow-sm w-100">
                <div class="card-body d-flex flex-column">
                    <h3 class="card-title text-center mb-4">
                        <i class="fas fa-cloud-upload-alt text-primary"></i> Загрузите фото
                    </h3>
                    
                    <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                        <div class="text-center p-5 border border-2 border-primary rounded bg-light w-100" style="min-height: 400px; display: flex; flex-direction: column; justify-content: center;">
                            <i class="fas fa-image fa-4x text-primary mb-3"></i>
                            <p class="mb-2">Нажмите или перетащите файл сюда</p>
                            <small class="text-muted">JPG, PNG, GIF до 5MB</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Правая часть - результат и кнопка -->
        <div class="col-md-6 d-flex">
            <div class="card shadow-sm w-100">
                <div class="card-body d-flex flex-column h-100">
                    <h3 class="card-title text-center mb-4">
                        <i class="fas fa-search text-primary"></i> Результат проверки
                    </h3>
                    
                    <div class="flex-grow-1 d-flex align-items-center justify-content-center text-center">
                        <div>
                            <i class="fas fa-image fa-4x text-muted mb-3"></i>
                            <p class="text-muted">Загрузите фото и нажмите "Проверить"</p>
                        </div>
                    </div>
                    
                    <button class="btn btn-primary btn-lg w-100 mt-3" id="check-button">
                        <i class="fas fa-check-circle"></i> Проверить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
